# nginx 作为前门：服务前端静态包 + 反代 /api 到 app（§3 仅 nginx 对内网暴露）。
# 本文件挂到 /etc/nginx/conf.d/default.conf，处于 http{} 上下文；
# limit_req_zone 只能位于 http 上下文，故置于 server{} 之外（§3 P-DEMO：nginx 基础限速）。
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://app:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /profile {
        proxy_pass http://app:8000/profile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端单页路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
