services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${CASE_DATABASE:?}
      POSTGRES_USER: case_user
      POSTGRES_PASSWORD: ${CASE_DB_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [case_internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U case_user -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    image: ${CASE_PROJECT:?}-backend:local
    build:
      context: ./backend
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PROFILE: demo
      DEPLOYMENT_MODE: local
      DATABASE_URL: ${DATABASE_URL:?}
      JWT_SECRET: ${JWT_SECRET:?}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?}
      INSTALLATION_ID: ${INSTALLATION_ID:?}
      ALLOWED_HOSTS: app,localhost,127.0.0.1
      UPLOAD_DIR: /data/uploads
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_MODEL: ''
      LOCAL_LLM_MODE: gpu_realtime
    volumes: [uploads:/data/uploads]
    networks: [case_internal]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=5)']
      interval: 5s
      timeout: 6s
      retries: 30
  frontend:
    image: ${CASE_PROJECT:?}-frontend:local
    build:
      context: ./frontend
    depends_on:
      app:
        condition: service_healthy
    ports: ['127.0.0.1:18090:80']
    networks: [case_internal]
networks:
  case_internal:
    internal: true
volumes:
  pgdata: {}
  uploads: {}
